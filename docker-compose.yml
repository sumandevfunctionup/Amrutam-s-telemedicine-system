version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amrutam_telemedicine_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_CONNECTION_STRING=${DB_CONNECTION_STRING:-postgresql://postgres:postgres@postgres:5432/amrutam_db}
      - JWT_SECRET=${JWT_SECRET:-amrutam_telemedicine_jwt_super_secret_key_2026}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-amrutam_telemedicine_jwt_refresh_super_secret_key_2026}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - MFA_APP_NAME=${MFA_APP_NAME:-Amrutam Telemedicine}
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL:-}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: amrutam_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: amrutam_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d amrutam_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
